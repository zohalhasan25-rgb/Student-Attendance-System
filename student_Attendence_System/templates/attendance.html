<!DOCTYPE html>
<html>
<head>
    <title>Take Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Take Attendance</h2>

    <div class="card shadow p-4">

        <div class="text-center">

            <video id="video"
                   width="500"
                   height="375"
                   autoplay
                   playsinline
                   class="border rounded">
            </video>

            <canvas id="canvas"
                    width="500"
                    height="375"
                    style="display:none;">
            </canvas>

            <br><br>

            <button class="btn btn-primary" onclick="startCamera()">
                Start Camera
            </button>

            <button class="btn btn-success" onclick="markAttendance()">
                Mark Attendance               
            </button>

            <button class="btn btn-danger" onclick="stopCamera()">
                Stop Camera
            </button>

            <p id="message" class="mt-3 fw-bold"></p>

        </div>

    </div>

    <br>

    <a href="/" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const message = document.getElementById("message");

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        video.srcObject = stream;

        message.innerText = "Camera started";

    } catch (error) {

        message.innerText = "Camera permission denied or camera unavailable";

    }
}


async function markAttendance() {

    if (!video.srcObject) {
        message.innerText = "Please start the camera first";
        return;
    }

    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const image = canvas.toDataURL("image/jpeg");

    message.innerText = "Recognizing face...";

    try {

        const response = await fetch("/recognize-face", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                image: image
            })

        });

        const result = await response.json();

        message.innerText = result.message;

    } catch (error) {

        message.innerText = "Error while marking attendance";

    }
}

function stopCamera() {
    const stream = video.srcObject;

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        message.innerText = "Camera stopped";
    }
}

</script>
</body>
</html>
