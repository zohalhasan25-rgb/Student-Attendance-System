<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>
</head>
<body>

<h1>Attendance Report</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Student ID</th>
        <th>Name</th>
        <th>Date</th>
        <th>Time</th>
    </tr>

    {% for row in records %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="/">Back to Home</a>

</body>
</html>
